<svg viewBox="0 0 376 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A Jazz Canon — Shelf &amp; Record mark (refined)">
  <!-- concept-4 refinement (Mon eve):
       • spines slimmed 12→10 (gap kept 4, step 14) → narrower overall, tighter viewBox
       • regrouped 4 LEFT of the gap, 5 RIGHT (leaner originates from the smaller left group)
       • lean tightened 18°→15°; right group moved in so the leaner's top-right still just
         meets the first right spine → the spanned gap shrinks 65→54px, geometry preserved
         (leaner pivots on its bottom-left corner (70,196); top-right ≈(124,32) meets x124)
       • play triangle moved to the LEFT EDGE OF THE RIGHT GROUP (carved into its first spine)
       Palette from design-spec §2. -->
  <defs>
    <clipPath id="c4b-rec"><circle cx="287" cy="110" r="74"/></clipPath>
  </defs>

  <!-- standing spines: thin (10), blue family. 4 left of the gap, 5 right -->
  <g>
    <rect x="18"  y="24" width="10" height="172" rx="2.5" fill="#2b5f7a"/>
    <rect x="32"  y="24" width="10" height="172" rx="2.5" fill="#4a7c95"/>
    <rect x="46"  y="24" width="10" height="172" rx="2.5" fill="#21506a"/>
    <rect x="60"  y="24" width="10" height="172" rx="2.5" fill="#2b5f7a"/>
    <!-- gap (70→124): the leaning LP nests here -->
    <rect x="124" y="24" width="10" height="172" rx="2.5" fill="#4a7c95"/>
    <rect x="138" y="24" width="10" height="172" rx="2.5" fill="#21506a"/>
    <rect x="152" y="24" width="10" height="172" rx="2.5" fill="#2b5f7a"/>
    <rect x="166" y="24" width="10" height="172" rx="2.5" fill="#4a7c95"/>
    <rect x="180" y="24" width="10" height="172" rx="2.5" fill="#21506a"/>
  </g>

  <!-- right third, tight: oval butts the last spine (ends 190), record flush to the oval -->
  <ellipse cx="203" cy="110" rx="13" ry="82" fill="#4a7c95"/>
  <circle cx="287" cy="110" r="74" fill="#2b5f7a"/>
  <g clip-path="url(#c4b-rec)" fill="none" stroke="#faf8f3" stroke-opacity="0.5" stroke-width="2.4">
    <circle cx="287" cy="110" r="26"/>
    <circle cx="287" cy="110" r="42"/>
    <circle cx="287" cy="110" r="58"/>
  </g>
  <circle cx="287" cy="110" r="8" fill="#c4862a"/>

  <!-- play system: track threads the shelf; triangle carved into the FIRST spine of the
       RIGHT group (left edge of the right group). Drawn before the leaner → track behind it. -->
  <rect x="14" y="107.5" width="110" height="5" rx="2.5" fill="#faf8f3"/>
  <path d="M125 100 L134 110 L125 120 Z" fill="#faf8f3"/>

  <!-- the leaning LP — single amber accent, from the left group. Pivots on its
       bottom-left corner (70,196), leans 15°; top-right just meets the first right spine. -->
  <rect x="70" y="24" width="10" height="172" rx="2.5" fill="#c4862a" transform="rotate(15 70 196)"/>
</svg>
