<svg viewBox="0 0 340 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A Jazz Canon — Shelf &amp; Record mark (refined)">
  <!-- concept-4 refinement v4 (Tue):
       • spines 8 wide (gap 4, step 12); 4 LEFT of the gap, 5 RIGHT
       • leaner pivots on its bottom-left corner at (62,196) — now TOUCHING the last left
         spine's bottom-right; leans 8°; its top-right (~94,27) just meets the first right
         spine (right group pulled in to x94 to keep both corners nesting)
       • NO play triangle / no track bar
       • record nudged so its left edge sits flush with the oval (overlap removed)
       • LP grooves ×6. Palette from design-spec §2. -->
  <defs>
    <clipPath id="c4b-rec"><circle cx="250" cy="110" r="74"/></clipPath>
  </defs>

  <!-- standing spines: thin (8), blue family. 4 left of the gap, 5 right -->
  <g>
    <rect x="18"  y="24" width="8" height="172" rx="2" fill="#2b5f7a"/>
    <rect x="30"  y="24" width="8" height="172" rx="2" fill="#4a7c95"/>
    <rect x="42"  y="24" width="8" height="172" rx="2" fill="#21506a"/>
    <rect x="54"  y="24" width="8" height="172" rx="2" fill="#2b5f7a"/>
    <!-- gap (62→94): the leaning LP nests here, touching both sides -->
    <rect x="94"  y="24" width="8" height="172" rx="2" fill="#4a7c95"/>
    <rect x="106" y="24" width="8" height="172" rx="2" fill="#21506a"/>
    <rect x="118" y="24" width="8" height="172" rx="2" fill="#2b5f7a"/>
    <rect x="130" y="24" width="8" height="172" rx="2" fill="#4a7c95"/>
    <rect x="142" y="24" width="8" height="172" rx="2" fill="#21506a"/>
  </g>

  <!-- right third: oval butts the last spine (ends 150); record flush to the oval (no overlap) -->
  <ellipse cx="163" cy="110" rx="13" ry="82" fill="#4a7c95"/>
  <circle cx="250" cy="110" r="74" fill="#2b5f7a"/>
  <g clip-path="url(#c4b-rec)" fill="none" stroke="#faf8f3" stroke-opacity="0.5" stroke-width="2">
    <circle cx="250" cy="110" r="16"/>
    <circle cx="250" cy="110" r="26"/>
    <circle cx="250" cy="110" r="37"/>
    <circle cx="250" cy="110" r="47"/>
    <circle cx="250" cy="110" r="57"/>
    <circle cx="250" cy="110" r="68"/>
  </g>
  <circle cx="250" cy="110" r="8" fill="#c4862a"/>

  <!-- the leaning LP — single amber accent, from the left group. SAME length as the spines
       (172). Leaned 8° and seated so its leading bottom corner rests exactly on the baseline
       (196): a leaned same-length bar spans slightly less than 172 vertically, so it sits
       fully WITHIN the stack's top/bottom lines — never above the top, never below the base.
       (Pivot y = 196 − 8·sin8° ≈ 194.9 puts the down-swinging corner on the baseline.) -->
  <rect x="62" y="22.9" width="8" height="172" rx="1" fill="#c4862a" transform="rotate(8 62 194.9)"/>
</svg>
