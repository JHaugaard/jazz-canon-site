<svg viewBox="0 0 360 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A Jazz Canon — Sound Lens mark">
  <defs>
    <clipPath id="c1-frame"><rect x="0" y="0" width="360" height="260" rx="18"/></clipPath>
    <clipPath id="c1-rec"><ellipse cx="300" cy="130" rx="46" ry="200"/></clipPath>
  </defs>

  <!-- lens train: navy barrel + optical elements; rightmost resolves into a record -->
  <g clip-path="url(#c1-frame)" fill="#314a7d">
    <rect x="0" y="0" width="96" height="260"/>
    <ellipse cx="150" cy="130" rx="30" ry="205"/>
    <ellipse cx="222" cy="130" rx="22" ry="205"/>
    <ellipse cx="300" cy="130" rx="46" ry="205"/>
  </g>

  <!-- play "track" + triangle on the barrel (carried from the original) -->
  <rect x="12" y="125" width="84" height="7" rx="3.5" fill="#faf8f3"/>
  <path d="M40 108 L66 130 L40 152 Z" fill="#faf8f3"/>

  <!-- vinyl grooves inside the final element -->
  <g clip-path="url(#c1-rec)" fill="none" stroke="#faf8f3" stroke-opacity="0.55" stroke-width="2.2">
    <circle cx="300" cy="130" r="15"/>
    <circle cx="300" cy="130" r="25"/>
    <circle cx="300" cy="130" r="35"/>
    <circle cx="300" cy="130" r="45"/>
  </g>
  <!-- brass spindle -->
  <circle cx="300" cy="130" r="6.5" fill="#c0883c"/>
</svg>
